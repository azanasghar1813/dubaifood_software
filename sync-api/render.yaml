services:
  - type: web
    name: dubaifood-sync-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DEVICE_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
